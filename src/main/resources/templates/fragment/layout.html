<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<!--
  Frammenti condivisi da tutte le pagine.
  Una pagina li include con:
    <head th:replace="~{fragments/layout :: head('Titolo pagina')}"></head>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  Così Bootstrap e il nostro CSS si dichiarano in un solo posto.
-->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - DisSpeak'">DisSpeak</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/disspeak.css}">
</head>

<body>
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</body>

</html>
